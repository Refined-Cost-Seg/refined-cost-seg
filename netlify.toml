# Netlify configuration — Refined Cost Segregation
# No build step needed: this is a static HTML site served as-is.

[build]
  publish = "."

# 2026-07-12: look-back service shelved — retired post 301s to the journal index.
# These MUST sit before the /journal/:slug pretty-URL rule (Netlify = first match wins).
[[redirects]]
  from = "/journal/look-back-cost-segregation-481a"
  to = "/journal/"
  status = 301
  force = true

[[redirects]]
  from = "/journal/look-back-cost-segregation-481a.html"
  to = "/journal/"
  status = 301
  force = true

# Pretty URLs: let /journal/some-post resolve to /journal/some-post.html
[[redirects]]
  from = "/journal/:slug"
  to = "/journal/:slug.html"
  status = 200
  force = false


[[redirects]]
  from = "/audit-support"
  to = "/audit-support.html"
  status = 200
  force = false


[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = false

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Root River Realty partner landing page — pretty URL + keep it out of search indexes
[[redirects]]
  from = "/root-river-realty"
  to = "/root-river-realty.html"
  status = 200
  force = false

[[headers]]
  for = "/root-river-realty*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/accessibility"
  to = "/accessibility.html"
  status = 200
  force = false

# /invest quick-checkout page (2026-08-15): pretty URL. Page is noindex by design
# and deliberately NOT in sitemap.xml.
[[redirects]]
  from = "/invest"
  to = "/invest.html"
  status = 200
  force = false

# 2026-07-12 scrub: internal planning docs must not serve publicly (publish='.')
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/SEO-BEST-PRACTICES.md"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/PUBLISHING-PLAYBOOK.md"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/CONTENT-CALENDAR.md"
  to = "/"
  status = 301
  force = true


# Internal quick-quote tool (2026-08-20): unlisted, noindex, not in sitemap.
[[redirects]]
  from = "/qq-x7k4"
  to = "/qq-x7k4.html"
  status = 200
  force = false

[[headers]]
  for = "/qq-x7k4*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
