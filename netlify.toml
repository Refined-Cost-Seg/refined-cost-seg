# Netlify configuration — Refined Cost Segregation
# No build step needed: this is a static HTML site served as-is.

[build]
  publish = "."

# 2026-07-12: look-back service shelved — retired post 301s to the journal index.
# These MUST sit before the /journal/:slug pretty-URL rule (Netlify = first match wins).
[[redirects]]
  from = "/journal/look-back-cost-segregation-481a"
  to = "/journal/"
  status = 301
  force = true

[[redirects]]
  from = "/journal/look-back-cost-segregation-481a.html"
  to = "/journal/"
  status = 301
  force = true

# 2026-09-23: a mistyped variant of the converting-a-primary-residence post (missing
# the "-to-") 404s but still draws Google impressions. Send it to the real page.
# Same ordering rule as above: must sit before the /journal/:slug rule.
[[redirects]]
  from = "/journal/converting-primary-residence-rental-cost-segregation.html"
  to = "/journal/converting-primary-residence-to-rental-cost-segregation.html"
  status = 301
  force = true

[[redirects]]
  from = "/journal/converting-primary-residence-rental-cost-segregation"
  to = "/journal/converting-primary-residence-to-rental-cost-segregation.html"
  status = 301
  force = true

# Pretty URLs: let /journal/some-post resolve to /journal/some-post.html
[[redirects]]
  from = "/journal/:slug"
  to = "/journal/:slug.html"
  status = 200
  force = false


[[redirects]]
  from = "/audit-support"
  to = "/audit-support.html"
  status = 200
  force = false


[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = false

# Journal posts are indexable by design. The default is index,follow, but state
# it explicitly so it is never ambiguous — and do it here rather than per-page so
# new posts are covered the moment they ship. Equivalent to a <meta name="robots">
# tag; the pages that already carry one agree with this and are unaffected.
[[headers]]
  for = "/journal/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Root River Realty partner landing page — pretty URL + keep it out of search indexes
[[redirects]]
  from = "/root-river-realty"
  to = "/root-river-realty.html"
  status = 200
  force = false

[[headers]]
  for = "/root-river-realty*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

