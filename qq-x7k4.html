<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCS Quick Quote</title>
<!-- INTERNAL TOOL — unlisted. Not linked anywhere, not in sitemap.xml. -->
<!-- Access-gated by ENCRYPTION, not by hiding. Everything the tool computes —
     markup, script, constants — ships only as AES-256-GCM ciphertext, so the
     served bytes carry no figures at all. The key is derived in the browser
     (PBKDF2-SHA-256) from the admin access code; a wrong code fails to decrypt.
     Neither the code nor the plaintext is in this file. Re-encrypt after an
     edit with tools/qq-encrypt.mjs — see PUBLISHING-PLAYBOOK.md. -->
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCS Quote">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Fingerprints only (no plaintext codes): the unlock does a cheap SHA-256
     pre-check against the admin entry before attempting the decryption. -->
<script src="/referral-codes.js"></script>
<style>
  :root{--navy:#1B2A3E;--paper:#FAF9F5;--sage:#5F7239;--panel:#F2F0E8;--line:#E8E5D9;--muted:#5B6570;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--navy);min-height:100vh;padding:1.1rem 1.1rem 2rem;max-width:480px;margin:0 auto;}
  [hidden]{display:none!important;}
  h1{font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);margin:.4rem 0 1.1rem;font-weight:700;}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:.9rem 0 .3rem;letter-spacing:.04em;}
  input[type=text],input[type=password]{width:100%;font-size:1.5rem;font-weight:600;padding:.65rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);-webkit-appearance:none;}
  input::placeholder{color:#98A0AB;font-weight:400;}
  input:focus{outline:2px solid var(--sage);border-color:var(--sage);}
  .seg{display:flex;gap:.4rem;flex-wrap:wrap;}
  .seg-units{display:grid;grid-template-columns:repeat(6,1fr);}
  .seg-units button{min-width:0;padding:.55rem 0;}
  .seg button{flex:1;min-width:30%;font-size:.85rem;font-weight:600;padding:.6rem .3rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer;}
  .seg button.on{background:var(--navy);border-color:var(--navy);color:var(--paper);}
  .out{margin-top:1.4rem;background:#1B2A3E;border-radius:14px;padding:1.2rem 1.3rem;color:#FAF9F5;}
  .out .lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#A8B981;}
  .out .fee{font-size:3rem;font-weight:800;line-height:1.2;color:#FFFFFF;letter-spacing:.01em;min-height:3.6rem;}
  .out .sub{font-size:.8rem;color:rgba(250,249,245,.75);margin-top:.35rem;line-height:1.5;}
  .note{margin-top:1rem;font-size:.72rem;color:var(--muted);line-height:1.5;}
  /* ---- access gate ---- */
  #gate{margin-top:2.2rem;}
  #gate .gate-sub{font-size:.82rem;color:var(--muted);line-height:1.55;margin-bottom:.4rem;}
  #gate button{margin-top:.7rem;width:100%;font-size:.95rem;font-weight:700;padding:.75rem 1rem;border:1.5px solid var(--navy);border-radius:10px;background:var(--navy);color:var(--paper);cursor:pointer;}
  #gate button[disabled]{opacity:.55;cursor:default;}
  #gateMsg{margin-top:.7rem;font-size:.82rem;font-weight:600;color:#8C2F2F;min-height:1.2rem;}
</style>
</head>
<body>
<h1>RCS Quick Quote</h1>

<!-- ============== ACCESS GATE (shown until the payload is decrypted) ============== -->
<form id="gate" autocomplete="off">
  <p class="gate-sub">Internal tool. Enter the admin access code to continue.</p>
  <label for="gateCode">Access code</label>
  <input type="password" id="gateCode" name="gateCode" inputmode="text" autocomplete="off"
         autocapitalize="characters" spellcheck="false" placeholder="Access code">
  <button type="submit" id="gateBtn">Unlock</button>
  <p id="gateMsg" role="status" aria-live="polite"></p>
</form>

<div id="app" hidden></div>

<script>
/* ---------------- access gate ----------------
   Two steps, in this order:
   1. A SHA-256 fingerprint pre-check against GATE_FINGERPRINTS below. It costs
      nothing and gives a clean "Invalid code" before we spend a quarter-million
      PBKDF2 iterations on a typo.
   2. The real gate: derive an AES-256-GCM key from the trimmed, upper-cased
      code with PBKDF2-SHA-256 and decrypt the payload. A wrong code cannot
      produce plaintext — GCM authentication fails and the calculator stays
      unreachable. There is no client-side flag to flip.
   The access code is never stored anywhere. sessionStorage holds only the
   already-decrypted payload, so a refresh in the same tab does not re-prompt;
   it dies with the tab and never contains the code itself. */
(function(){
  var STORE='rcs_qqx7k4_open';
  var gate=document.getElementById('gate');
  var app=document.getElementById('app');
  var input=document.getElementById('gateCode');
  var btn=document.getElementById('gateBtn');
  var msg=document.getElementById('gateMsg');
  var BAD='Invalid code.';

  function cfg(){
    try{ return JSON.parse(document.getElementById('qq-payload').textContent); }
    catch(e){ return null; }
  }

  function bytes(b64){
    var bin=atob(b64), out=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++){ out[i]=bin.charCodeAt(i); }
    return out;
  }

  /* The gate's own fingerprint, pinned here on purpose.
     This used to be read from the admin:true entry in /referral-codes.js, which
     welded the calculator's access code to the order form's NO-PAYMENT lane:
     one code did both jobs, so rotating either one broke or exposed the other.
     They are separate secrets now.
     Rotating THIS one means re-encrypting the payload in the same commit
     (tools/qq-encrypt.mjs) — the fingerprint and the ciphertext are derived
     from the same code and must move together, or the page stops opening. */
  var GATE_FINGERPRINTS=['6550e8ed66406a2dc6ca17f3746101add343daa6edd58bef4a2c18265833970f'];
  function adminHashes(){ return GATE_FINGERPRINTS.slice(); }

  function sha256Hex(str){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){
        return ('00'+b.toString(16)).slice(-2);
      }).join('');
    });
  }

  /* PBKDF2-SHA-256 over the code -> AES-256-GCM key -> decrypt -> UTF-8 string. */
  function decrypt(code){
    var c=cfg();
    if(!c || !c.ciphertext || !c.salt || !c.iv){ return Promise.reject(new Error('payload')); }
    return crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:bytes(c.salt), iterations:(c.iterations||250000), hash:'SHA-256' },
          base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:'AES-GCM', iv:bytes(c.iv) }, key, bytes(c.ciphertext));
      })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }

  /* innerHTML never runs a <script>, so lift the scripts out and run them
     after the markup is in the document — the calculator binds to #price and
     the segmented buttons on execution. */
  function inject(plain){
    var holder=document.createElement('div');
    holder.innerHTML=plain;
    var code=[];
    Array.prototype.forEach.call(holder.querySelectorAll('script'), function(s){
      code.push(s.textContent||'');
      s.parentNode.removeChild(s);
    });
    app.innerHTML=holder.innerHTML;
    gate.hidden=true;
    app.hidden=false;
    for(var i=0;i<code.length;i++){
      try{ (new Function(code[i]))(); }
      catch(e){ msg.textContent='The calculator failed to start — reload the page.'; }
    }
    var p=document.getElementById('price');
    /* Open on a real worked quote instead of an empty box. The placeholder used
       to render "$ 500,000" at the same size and weight as a real entry, so the
       tool looked like it had a price in it and had failed to produce a fee —
       the fee line said "—" and the sub-line said "enter a purchase price", and
       both got read as a broken calculator. Seeding an actual value makes the
       empty state impossible to mistake for a computed one. Selected, so the
       first keystroke replaces it. */
    if(p){
      if(!p.value){
        p.value='500000';
        p.dispatchEvent(new Event('input',{bubbles:true}));
      }
      p.focus();
      if(p.select){ p.select(); }
    }
  }

  function remember(plain){ try{ sessionStorage.setItem(STORE, plain); }catch(e){} }
  function remembered(){ try{ return sessionStorage.getItem(STORE); }catch(e){ return null; } }

  var open=remembered();
  if(open){ inject(open); }

  gate.addEventListener('submit', function(e){
    e.preventDefault();
    var raw=(input.value||'').trim().toUpperCase();
    if(!raw){ msg.textContent='Enter the access code.'; return; }
    if(!(window.crypto && crypto.subtle)){ msg.textContent='This browser cannot unlock the tool (needs a secure connection).'; return; }
    btn.disabled=true; msg.textContent='Checking…';
    var allowed=adminHashes();
    sha256Hex(raw).then(function(hex){
      /* Skip the wasted key derivation on a code we already know is wrong.
         If referral-codes.js failed to load we simply go straight to the
         decryption, which is the authority either way. */
      if(allowed.length && allowed.indexOf(hex.toLowerCase())===-1){ return Promise.reject(new Error('nomatch')); }
      return decrypt(raw);
    }).then(function(plain){
      btn.disabled=false;
      msg.textContent='';
      input.value='';
      remember(plain);
      inject(plain);
    }).catch(function(err){
      btn.disabled=false;
      input.value='';
      input.focus();
      msg.textContent = (err && err.message==='payload')
        ? 'The tool payload is missing — re-run tools/qq-encrypt.mjs.'
        : BAD;
    });
  });
})();
</script>
