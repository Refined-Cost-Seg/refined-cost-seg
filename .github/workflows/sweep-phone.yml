# One-shot: replace the old business number site-wide, commit, then remove this file.
name: Sweep phone number
on:
  push:
    branches: [main]
    paths: [".github/workflows/sweep-phone.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace 414-429-5333 -> 414-206-1948
        run: |
          set -e
          FILES=$(grep -rIl --exclude-dir=.git --exclude=sweep-phone.yml -E '4144295333|414-429-5333' . || true)
          for f in $FILES; do sed -i 's/4144295333/4142061948/g; s/414-429-5333/414-206-1948/g' "$f"; done
          echo "changed: $(echo "$FILES" | grep -c . || true)"
          git rm -q .github/workflows/sweep-phone.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phone: 414-429-5333 -> 414-206-1948 site-wide (Quo business line)"
          git push
