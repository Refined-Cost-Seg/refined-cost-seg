# Links new journal posts into journal/index.html and the homepage journal grid.
#
# The two index pages are too large to re-emit safely through an API client, so a
# publisher never edits them. It commits the post plus a small hand-off file at
# journal/_inbox/<slug>.json (schema in scripts/splice_posts.py); this workflow
# splices the card, the BlogPosting entry, the homepage feature and the sitemap
# entry in, deletes the inbox file, and pushes one commit. Netlify deploys that
# commit like any other. A push made with GITHUB_TOKEN does not re-trigger this
# workflow, so there is no loop.
name: Splice journal posts

on:
  push:
    branches: [main]
    paths:
      - "journal/_inbox/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: splice-posts
  cancel-in-progress: false

jobs:
  splice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Splice inbox posts into the index surfaces
        id: splice
        run: python3 scripts/splice_posts.py

      - name: Commit and push
        id: push
        env:
          TITLES: ${{ steps.splice.outputs.titles }}
        run: |
          git config user.name "rcs-splice"
          git config user.email "admin@refinedcostseg.com"
          git add -A journal/index.html index.html sitemap.xml journal/_inbox
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: link new post into journal + home" -m "${TITLES:-inbox drained}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # IndexNow: tell Bing and the other IndexNow engines the two index pages changed.
      # Best-effort — a non-2xx is logged, never fails the job. Key file lives at the site root.
      - name: Ping IndexNow
        if: steps.push.outputs.pushed == 'true'
        run: |
          sleep 90
          code=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"www.refinedcostseg.com","key":"a4bc166e0151b19f17a930b84fb79a87","keyLocation":"https://www.refinedcostseg.com/a4bc166e0151b19f17a930b84fb79a87.txt","urlList":["https://www.refinedcostseg.com/","https://www.refinedcostseg.com/journal/"]}')
          echo "indexnow: HTTP $code"
